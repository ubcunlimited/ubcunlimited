    <!-- Hide static scaffold after React hydrates to prevent duplicate content -->
    <script>
      (function() {
        var scaffold = document.getElementById('static-a11y-scaffold');
        var root = document.getElementById('root');
        if (!scaffold || !root) return;
        var observer = new MutationObserver(function() {
          if (root.children.length > 0) {
            scaffold.setAttribute('aria-hidden', 'true');
            scaffold.style.display = 'none';
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
